; =============================================================================
;  KittyPrinter IPP Bridge - PlatformIO project configuration
;
;  Targets an ESP32-S3 with PSRAM and 4MB+ flash. Arduino-ESP32 v3.x (ESP-IDF 5.x) is used
;  through the community maintained "pioarduino" platform because the
;  multi-instance mDNS API (one _ipp._tcp record per BLE printer) is only
;  available in ESP-IDF 5.x.
;
;  Environments:
;    esp32s3-n16r8  - ESP32-S3 with 16MB flash and 8MB octal PSRAM
;    esp32s3-fh4r2  - ESP32-S3FH4R2 with 4MB flash and 2MB quad PSRAM
;    native         - Host unit tests for the hardware independent libraries
;
;  Build:   pio run -e esp32s3-n16r8
;  Flash:   pio run -e esp32s3-n16r8 -t upload
;  Monitor: pio device monitor
;  Tests:   pio test -e native
; =============================================================================

[platformio]
default_envs = esp32s3-n16r8

; -----------------------------------------------------------------------------
; Shared settings for all ESP32-S3 firmware builds
; -----------------------------------------------------------------------------
[esp32_common]
platform = espressif32@8.0.0
framework = arduino
board = esp32-s3-devkitc-1
board_build.embed_txtfiles =
    html/index.html

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
lib_deps =
    h2zero/NimBLE-Arduino @ ^2.5.2
    ESP32Async/ESPAsyncWebServer @ ^3.12.1
    ESP32Async/AsyncTCP @ ^3.5.0
    bblanchon/ArduinoJson @ ^7.4.2
build_flags =
    -O2
    -fexceptions
    -Wall
    -Wextra
    -Wno-unused-parameter
    -Wno-missing-field-initializers
    ; ---- NimBLE: central role only, no peripheral/broadcaster needed -------
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    ; ---- AsyncTCP tuning ----------------------------------------------------
    -DCONFIG_ASYNC_TCP_STACK_SIZE=8192
    -DCONFIG_ASYNC_TCP_QUEUE_SIZE=64
    ; ---- Bridge defaults (override in platformio_override.ini) --------------
    -DCATBRIDGE_HOSTNAME=\"catbridge\"
    -DCATBRIDGE_VERSION=\"1.0.0\"

[env:esp32s3-n16r8]
extends = esp32_common
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${esp32_common.build_flags}
    -DBOARD_HAS_PSRAM

; -----------------------------------------------------------------------------
; Host based unit tests (Unity). Only hardware independent libraries are
; compiled: IppProtocol, RasterPipeline and CatProtocol.
; -----------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
lib_ldf_mode = chain
lib_compat_mode = strict
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
