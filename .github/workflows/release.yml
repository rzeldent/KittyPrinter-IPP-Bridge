name: Create release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'New release tag (for example, v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        environment: [esp32s3-n16r8]
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate new tag
        shell: bash
        run: |
          if [[ "$RELEASE_TAG" == -* ]] || ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "::error::Invalid release tag"
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "::error::Release tag already exists; choose a new tag"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install platformio

      - name: Build firmware
        run: platformio run -e ${{ matrix.environment }}

      - name: Prepare release files
        run: |
          mkdir -p artifacts
          cp .pio/build/${{ matrix.environment }}/firmware.bin artifacts/${{ matrix.environment }}.bin
          cp .pio/build/${{ matrix.environment }}/firmware.elf artifacts/${{ matrix.environment }}.elf

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.environment }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download firmware
        uses: actions/download-artifact@v7
        with:
          pattern: esp32s3-*
          merge-multiple: true
          path: artifacts

      - name: Tag source commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate --message "Release $RELEASE_TAG" -- "$RELEASE_TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes \
            artifacts/*.bin \
            artifacts/*.elf
